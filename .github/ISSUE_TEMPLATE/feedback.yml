name: Feedback
description: Share product, positioning, documentation, or adoption feedback.
title: "[Feedback]: "
labels: ["feedback"]
body:
  - type: textarea
    id: reaction
    attributes:
      label: What resonated or felt useful?
    validations:
      required: true
  - type: textarea
    id: confusing
    attributes:
      label: What was confusing or missing?
  - type: textarea
    id: adoption
    attributes:
      label: What would need to be true for you or your team to try Reflective?
  - type: textarea
    id: alternatives
    attributes:
      label: What do you use today?
      description: Optional. Mention tools or workflows if relevant.
